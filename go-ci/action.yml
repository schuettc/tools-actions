name: Go CI
description: >-
  The .tools family Go gate: gofmt, go vet, golangci-lint (pinned,
  checksum-verified; config verified before use), go test -race, and a
  CGO_ENABLED=0 build for each release target. Uses the repo's own
  .golangci.yml when it has one, else the family default shipped with this
  action. The calling job must check out the tree.

inputs:
  packages:
    description: "Package patterns for vet, lint, test and build."
    required: false
    default: "./..."
  race:
    description: "Run go test with -race."
    required: false
    default: "true"
  targets:
    description: "GOOS/GOARCH pairs to cross-build."
    required: false
    default: "darwin/arm64 darwin/amd64 linux/amd64 linux/arm64"
  lint:
    description: 'Run golangci-lint. "false" only while a repo is fixing its first findings.'
    required: false
    default: "true"
  setup-go:
    description: "Run actions/setup-go with go-version-file."
    required: false
    default: "true"
  go-version-file:
    description: "Passed to actions/setup-go."
    required: false
    default: go.mod

runs:
  using: composite
  steps:
    - if: inputs.setup-go == 'true'
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
    - name: Install pinned golangci-lint
      if: inputs.lint == 'true'
      shell: bash
      run: |
        # Version and per-platform checksums come from golangci-lint.lock, the
        # same file local.sh uses, so CI and `just verify` run one linter.
        set -euo pipefail
        lock="$GITHUB_ACTION_PATH/golangci-lint.lock"
        v="$(awk '$1=="version"{print $2}' "$lock")"
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in arm64|aarch64) arch=arm64;; *) arch=amd64;; esac
        want="$(awk -v k="$os-$arch" '$1==k{print $2}' "$lock")"
        [ -n "$want" ] || { echo "::error::golangci-lint.lock has no checksum for $os-$arch"; exit 1; }
        name="golangci-lint-${v}-${os}-${arch}"
        curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v${v}/${name}.tar.gz" -o "$RUNNER_TEMP/gcl.tar.gz"
        got="$( (shasum -a 256 "$RUNNER_TEMP/gcl.tar.gz" 2>/dev/null || sha256sum "$RUNNER_TEMP/gcl.tar.gz") | awk '{print $1}')"
        [ "$got" = "$want" ] || { echo "::error::golangci-lint checksum mismatch ($got)"; exit 1; }
        tar -xzf "$RUNNER_TEMP/gcl.tar.gz" -C "$RUNNER_TEMP"
        mkdir -p "$RUNNER_TEMP/bin" && mv "$RUNNER_TEMP/$name/golangci-lint" "$RUNNER_TEMP/bin/"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/golangci-lint" version
    - name: Go gate
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        RACE: ${{ inputs.race }}
        TARGETS: ${{ inputs.targets }}
        SKIP_LINT: ${{ inputs.lint != 'true' }}
        FAMILY_CONFIG: ${{ github.action_path }}/golangci.yml
      run: bash "$GITHUB_ACTION_PATH/ci.sh"
