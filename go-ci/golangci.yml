# The family's default golangci-lint config (v2), used by go-ci when a repo
# has no .golangci.yml of its own. The standard set: errcheck, govet,
# ineffassign, staticcheck, unused. A repo that needs more (or named
# exclusions) keeps its own config, which go-ci always prefers.
version: "2"
run:
  # Match exclusion paths against the path inside the checkout, so a checkout
  # that itself lives under <repo>/.worktrees/<branch> (how this family works)
  # is linted like any other.
  relative-path-mode: gitroot
linters:
  default: standard
  exclusions:
    paths:
      # Go includes node_modules in ./..., and web tooling can vendor Go there.
      # (.worktrees needs no rule: ./... never enters a directory starting with ".")
      - (^|/)node_modules/
