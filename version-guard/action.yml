name: Version guard
description: >-
  Fails a pull request into the release branch whose VERSION was not raised to
  a newer plain semver, unless it carries the `no-release` label. Without it a
  merge silently releases nothing. Run on pull_request (opened, synchronize,
  reopened, labeled, unlabeled, edited) for the release branch; the calling
  job must check out with fetch-depth 0 and grant `pull-requests: read`
  (the current labels are read from the API).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/guard.sh"
