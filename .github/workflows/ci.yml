name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  # Pinned actionlint (release binary, checksum-verified). Dependabot can't
  # bump these env strings: bump the actionlint, shellcheck and yq pins by
  # hand, updating each VERSION and its SHA256 together.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  # Pinned shellcheck (release binary, checksum-verified).
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  # Pinned mikefarah yq (release binary, checksum-verified) for fork-sync/tests/action.sh.
  YQ_VERSION: "4.53.6"
  YQ_SHA256: "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385"

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint.tar.gz actionlint
          actionlint -version
      - name: Install pinned shellcheck
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-v${SHELLCHECK_VERSION}"
          shellcheck --version
      - name: actionlint
        run: actionlint
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts to lint."
            exit 0
          fi
          shellcheck "${files[@]}"

  fork-sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.20.0"
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint.tar.gz actionlint
          actionlint -version
      - name: Install pinned yq
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          curl -fsSL "$url" -o yq
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          sudo install -m 0755 yq /usr/local/bin/yq
          rm -f yq
          yq --version
      - name: upstream-sync.sh + first-publish.sh (hermetic, bash 5)
        shell: bash
        run: bash fork-sync/tests/test.sh
      - name: action.yml + README caller contract
        shell: bash
        run: bash fork-sync/tests/action.sh

  tested-tree:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint.tar.gz actionlint
          actionlint -version
      - name: action.yml matches SOURCE + README examples
        shell: bash
        run: bash tested-tree/tests/check.sh

  images:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.11", "3.14.0"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install test deps
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: images tests
        shell: bash
        run: python -m pytest images/tests -q

  release-version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: release-version tests
        shell: bash
        run: bash release-version/tests/test.sh

  go-release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
      - name: go-release tests
        shell: bash
        run: bash go-release/tests/test.sh

  go-ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
      - name: Install pinned golangci-lint (for the family-config test)
        shell: bash
        run: |
          set -euo pipefail
          v=2.12.2; sha=8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553
          curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz" -o gcl.tgz
          echo "$sha  gcl.tgz" | sha256sum -c -
          tar -xzf gcl.tgz && sudo install -m 0755 "golangci-lint-$v-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint
          rm -rf gcl.tgz "golangci-lint-$v-linux-amd64"
      - name: go-ci tests
        shell: bash
        env:
          REAL_GOLANGCI_LINT: /usr/local/bin/golangci-lint
        run: bash go-ci/tests/test.sh
      - name: go-ci local runner tests
        shell: bash
        run: bash go-ci/tests/local.sh
